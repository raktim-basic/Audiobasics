name: Build YT Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'zulu'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/audiobasics.jks

      - name: Inject app icon (adaptive)
        run: |
          pip install Pillow -q
          python3 << 'EOF'
          import base64, os
          from PIL import Image, ImageDraw
          import io

          # Adaptive icon foreground layer sizes: 108dp canvas scaled per density
          # (not the old 48dp legacy launcher-icon sizes) — the background is the
          # separate solid #24292F color declared in res/values/colors.xml and
          # res/mipmap-anydpi-v26/ic_launcher.xml, both committed to the repo.

          sizes = {
              'mdpi': 108, 'hdpi': 162, 'xhdpi': 216,
              'xxhdpi': 324, 'xxxhdpi': 432
          }

          icon_b64 = '${{ secrets.APP_ICON_BASE64 }}'
          for density, size in sizes.items():
              dir_path = f"app/src/main/res/mipmap-{density}"
              os.makedirs(dir_path, exist_ok=True)
              out_path = f"{dir_path}/ic_launcher_foreground.png"

              if icon_b64.strip():
                  try:
                      icon_data = base64.b64decode(icon_b64.strip())
                      img = Image.open(io.BytesIO(icon_data)).convert("RGBA")

                      # Keep the original artwork's aspect ratio and leave
                      # enough breathing room for Android's adaptive-icon mask.
                      target_width = int(size * 0.70)
                      target_height = int(target_width * img.height / img.width)

                      img = img.resize(
                          (target_width, target_height),
                          Image.Resampling.LANCZOS
                      )

                      # Center the proportionally-scaled artwork on the
                      # transparent adaptive-icon foreground canvas.
                      resized = Image.new(
                          "RGBA",
                          (size, size),
                          (0, 0, 0, 0)
                      )

                      x = (size - img.width) // 2
                      y = (size - img.height) // 2
                      resized.alpha_composite(img, (x, y))

                      resized.save(out_path, "PNG")

                      print(f"Injected icon: {out_path}")
                      continue

                  except Exception as e:
                      print(f"Icon injection failed: {e}, using default")

              # Default icon — transparent canvas, white ring + red dot inset to
              # roughly the same safe zone as the real artwork.
              img = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)

              margin = size // 3
              draw.ellipse(
                  [margin, margin, size - margin, size - margin],
                  outline=(255, 255, 255, 255),
                  width=max(2, size // 16)
              )

              inner = size // 2 - size // 10
              outer = size // 2 + size // 10
              draw.ellipse(
                  [inner, inner, outer, outer],
                  fill=(255, 0, 0, 255)
              )

              img.save(out_path, "PNG")
              print(f"Default icon created: {out_path}")

          EOF

      - name: Build signed release APK
        run: gradle clean assembleRelease --no-build-cache --no-configuration-cache --rerun-tasks --stacktrace
        env:
          KEYSTORE_PATH: audiobasics.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload build reports (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build/reports/
            app/build/reports/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: audiobasics-apk
          path: app/build/outputs/apk/release/app-release.apk

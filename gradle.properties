android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx2048m
# KSP2 (the new K2-based backend, default since KSP 2.0.x) throws a generic, unhelpful
# "[MissingType]: Element 'AppDatabase' references a type that is not present" for Room
# specifically, with no indication of which type is actually missing — a known rough edge
# tracked in several google/ksp GitHub issues. Forcing the older KSP1 backend either resolves
# it outright or, if something is still genuinely wrong, prints the real missing type by name
# instead of this dead end.
ksp.useKSP2=false
